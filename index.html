<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribo Burger - Gestão de Custos & CMV</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0D0C0B; color: #FAF8F5; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden">
    <!-- UI simplificada para focar na resolução do erro -->
    <main class="flex-1 p-8">
        <h1 class="text-2xl font-bold text-white mb-6">Painel de Recuperação de Dados</h1>
        
        <div class="bg-brand-dark border border-brand-border p-6 rounded-xl max-w-lg">
            <label class="block text-xs font-bold text-brand-textMuted uppercase mb-2">Cole aqui o UID Antigo:</label>
            <input id="recovery-old-uid" type="text" value="9AbYn0sJYLNABoNGf0jj6AciSEs2" class="w-full bg-brand-gray text-white p-3 rounded mb-4 font-mono text-xs">
            <button onclick="attemptDataRecovery()" class="w-full bg-brand-accent hover:bg-brand-accentHover text-black font-bold py-3 rounded">
                Recuperar Dados Agora
            </button>
            <div id="logs" class="mt-4 p-4 bg-black text-green-400 font-mono text-[10px] h-32 overflow-y-auto"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const officialFirebaseConfig = {
            apiKey: "AIzaSyA1HkiCs0F4BkHeDNVNHNuhG0Ktd2VQDLU",
            authDomain: "tribocmv.firebaseapp.com",
            projectId: "tribocmv",
            storageBucket: "tribocmv.firebasestorage.app",
            messagingSenderId: "740375597526",
            appId: "1:740375597526:web:f826bba62245da21f0d477",
            measurementId: "G-MH1LE7T5P1"
        };

        const app = initializeApp(officialFirebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'tribo-burger-pricing-system';

        window.attemptDataRecovery = async function() {
            const oldUid = document.getElementById('recovery-old-uid').value.trim();
            const logBox = document.getElementById('logs');
            logBox.innerHTML = "Iniciando recuperação...\n";

            const collectionsToFetch = ['insumos', 'recipes', 'combos', 'fixed_costs', 'categories'];
            
            // Verifica login
            const user = auth.currentUser;
            if (!user) {
                logBox.innerHTML += "ERRO: Utilizador não logado. Faça login primeiro.\n";
                return;
            }

            for (const colName of collectionsToFetch) {
                try {
                    logBox.innerHTML += `Buscando ${colName}...\n`;
                    const snap = await db.collection('artifacts').doc(appId).collection('users').doc(oldUid).collection(colName).get();
                    
                    if (snap.empty) {
                        logBox.innerHTML += `-> Nenhum dado em ${colName}\n`;
                        continue;
                    }

                    logBox.innerHTML += `-> Encontrados ${snap.size} documentos. Migrando...\n`;
                    
                    const batch = db.batch();
                    snap.docs.forEach(docSnap => {
                        const newDocRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection(colName).doc(docSnap.id);
                        batch.set(newDocRef, docSnap.data());
                    });
                    
                    await batch.commit();
                    logBox.innerHTML += `✅ ${colName} migrado com sucesso!\n`;

                } catch (err) {
                    logBox.innerHTML += `❌ ERRO em ${colName}: ${err.message}\n`;
                }
            }
            logBox.innerHTML += "FINALIZADO. Recarregue a página.";
        };
    </script>
</body>
</html>
