                                                        <option value="">{type === 'transferencia' ? 'Transferência' : 'Nenhum...'}</option>
                                                        {type !== 'transferencia' && suppliers.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1"><label className="text-[8px] font-black uppercase text-slate-400 ml-2">Data Emissão</label><input type="date" className="w-full p-3 border rounded-xl text-[10px] font-bold focus:border-black outline-none transition-colors" value={date} onChange={e=>setDate(e.target.value)} required /></div>
                                                <div className="space-y-1"><label className="text-[8px] font-black uppercase text-slate-400 ml-2">Data Vencimento</label><input type="date" className="w-full p-3 border rounded-xl text-[10px] font-bold focus:border-black outline-none transition-colors" value={clearance} onChange={e=>setClearance(e.target.value)} required /></div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button type="button" onClick={()=>setStatus('pago')} className={"flex-1 p-3 rounded-xl border font-black text-[10px] transition-all " + (status==='pago'?'bg-green-500 border-green-600 text-white shadow-md':'bg-slate-50 border-slate-200 text-slate-400 hover:bg-slate-100')}><Check className="inline w-3 h-3 mr-1 mb-0.5" /> PAGO</button>
                                                <button type="button" onClick={()=>setStatus('pendente')} className={"flex-1 p-3 rounded-xl border font-black text-[10px] transition-all " + (status==='pendente'?'bg-orange-500 border-orange-600 text-white shadow-md':'bg-slate-50 border-slate-200 text-slate-400 hover:bg-slate-100')}><Calendar className="inline w-3 h-3 mr-1 mb-0.5"/> PENDENTE</button>
                                            </div>
                                            <button className="w-full bg-black hover:bg-slate-800 text-[#F8CC82] p-5 rounded-2xl font-black uppercase text-xs shadow-xl active:scale-95 transition-all mt-2">
                                                {editingId ? <span className="flex items-center justify-center gap-2"><Edit2 size={16}/> Atualizar Lançamento</span> : <span className="flex items-center justify-center gap-2"><PlusCircle size={16}/> Gravar Novo Lançamento</span>}
                                            </button>
                                        </form>

                                        <div className="lg:col-span-2 glass-card rounded-[2.5rem] shadow-sm h-[700px] flex flex-col border overflow-hidden">
                                            <div className="p-4 bg-slate-50 border-b space-y-4">
                                                {/* SUMÁRIO INTELIGENTE DOS FILTROS */}
                                                <div className="flex flex-wrap justify-between items-center bg-white p-3 rounded-2xl border shadow-sm gap-2 animate-in fade-in">
                                                    <span className="text-[9px] font-black uppercase text-slate-400 flex items-center gap-1.5">
                                                        <Search size={14} className="text-slate-300" /> Resultados ({filteredDashboard.length})
                                                    </span>
                                                    <div className="flex gap-3 text-[11px] font-black items-center">
                                                        {typeFilter !== 'saida' && typeFilter !== 'transferencia' && filteredSummary.entradas > 0 && (
                                                            <span className="text-green-600 px-2 py-1 bg-green-50 rounded-lg">IN: + {formatMoney(filteredSummary.entradas)}</span>
                                                        )}
                                                        {typeFilter !== 'entrada' && typeFilter !== 'transferencia' && filteredSummary.saidas > 0 && (
                                                            <span className="text-red-500 px-2 py-1 bg-red-50 rounded-lg">OUT: - {formatMoney(filteredSummary.saidas)}</span>
                                                        )}
                                                        {typeFilter === 'transferencia' && (
                                                            <span className="text-blue-600 px-2 py-1 bg-blue-50 rounded-lg">TRANSF: {formatMoney(filteredSummary.transfs)}</span>
                                                        )}
                                                        {typeFilter === 'todos' && (
                                                            <span className={"px-3 py-1.5 rounded-lg " + (filteredSummary.saldo >= 0 ? "bg-blue-50 text-blue-700 border border-blue-100" : "bg-orange-50 text-orange-700 border border-orange-100")}>
                                                                SALDO LÍQUIDO: {formatMoney(filteredSummary.saldo)}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="relative">
                                                    <Search size={16} className="absolute left-4 top-3.5 text-slate-300" />
                                                    <input type="text" placeholder="Pesquisar por descrição ou categoria..." className="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-xs font-bold outline-none focus:border-black shadow-inner transition-colors" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} />
                                                </div>
                                                <div className="flex flex-wrap gap-2 items-center">
                                                    <select className="p-2.5 border rounded-xl text-[9px] font-black uppercase bg-white outline-none focus:border-black transition-colors" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
                                                        <option value="todos">Todos os Fluxos</option>
                                                        <option value="entrada">Apenas Entradas</option>
                                                        <option value="saida">Apenas Saídas</option>
                                                        <option value="transferencia">Transferências</option>
                                                    </select>
                                                    <select className="p-2.5 border rounded-xl text-[9px] font-black uppercase bg-white outline-none focus:border-black transition-colors" value={accFilter} onChange={e=>setAccFilter(e.target.value)}>
                                                        <option value="">Todas as Contas</option>
                                                        {accounts.map(a=><option key={a.id} value={a.name}>{a.name}</option>)}
                                                    </select>
                                                    <select className="p-2.5 border rounded-xl text-[9px] font-black uppercase bg-white outline-none focus:border-black transition-colors" value={catFilter} onChange={e=>setCatFilter(e.target.value)}>
                                                        <option value="">Todas as Categorias</option>
                                                        {sortedCategories.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
                                                    </select>
                                                    <button onClick={()=>setHideForecasts(!hideForecasts)} className={"p-2.5 rounded-xl text-[9px] font-black uppercase border transition-all " + (hideForecasts ? 'bg-black text-[#F8CC82] border-black shadow-md' : 'bg-white text-slate-400 hover:bg-slate-50')}>
                                                        {hideForecasts ? 'Previsões Ocultas' : 'Mostrar Previsões'}
                                                    </button>
                                                    <button onClick={()=>setHideCards(!hideCards)} className={"p-2.5 rounded-xl text-[9px] font-black uppercase border transition-all " + (hideCards ? 'bg-black text-[#F8CC82] border-black shadow-md' : 'bg-white text-slate-400 hover:bg-slate-50')}>
                                                        {hideCards ? 'Cartões Ocultos' : 'Mostrar Cartões'}
                                                    </button>
                                                </div>
                                            </div>
                                            
                                            <div className="flex-1 overflow-y-auto no-scrollbar divide-y divide-slate-100 bg-white">
                                                {displayedTransactions.length === 0 ? (
                                                    <div className="flex flex-col items-center justify-center h-full p-16 text-center opacity-60">
                                                        <Search size={48} className="text-slate-300 mb-4" />
                                                        <p className="text-slate-500 font-black uppercase text-xs tracking-widest">Nenhum lançamento encontrado</p>
                                                        <p className="text-slate-400 font-semibold text-[10px] mt-2">Ajuste os filtros ou o mês de pesquisa acima.</p>
                                                    </div>
                                                ) : displayedTransactions.map(t => {
                                                    const accInfo = accounts.find(a => a.name === t.account); 
                                                    const { clearanceDate } = getTransactionDates(t, accInfo);
                                                    
                                                    const typeColors = {
                                                        'entrada': 'bg-green-100 text-green-700 border-green-200',
                                                        'saida': 'bg-red-50 text-red-600 border-red-100',
                                                        'transferencia': 'bg-blue-100 text-blue-700 border-blue-200'
                                                    };
                                                    
                                                    const typeLabels = { 'entrada': 'IN', 'saida': 'OUT', 'transferencia': 'TR' };

                                                    return (
                                                        <div key={t.id} className="p-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 hover:bg-slate-50 transition-colors group">
                                                            <div className="flex items-center gap-4 min-w-0">
                                                                <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-[9px] border shadow-sm shrink-0 ${typeColors[t.type]}`}>
                                                                    {typeLabels[t.type]}

                                                            <div>
                                                                <p className="font-black text-xs uppercase leading-none text-slate-800">{a.name}</p>
                                                                <p className="text-[9px] font-bold text-slate-400 uppercase mt-1.5 bg-slate-100 px-2 py-0.5 rounded inline-block border">{a.type} {a.type === 'cartao' && " • Fecho: " + (a.closing || a.closingDay || '25') + " • Venc: " + (a.due || a.dueDay || '10')}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-2 items-center shrink-0 border-t sm:border-t-0 pt-3 sm:pt-0 mt-2 sm:mt-0">
                                                            <button type="button" onClick={()=>setAccForm(Object.assign({}, a, { closing: a.closing || a.closingDay || '25', due: a.due || a.dueDay || '10' }))} className="bg-blue-50 text-blue-600 hover:bg-blue-100 w-8 h-8 rounded-lg flex items-center justify-center transition-colors border border-blue-100" title="Editar"><Edit2 size={14}></Edit2></button>
                                                            <button type="button" onClick={() => executeDelete('accounts', a.id)} className={"transition-all w-8 h-8 flex items-center justify-center rounded-lg border " + (deleteConfirmId === a.id ? 'delete-confirm bg-red-600 border-red-700 w-auto px-3' : 'text-red-500 bg-red-50 hover:bg-red-100 border-red-100')} title="Excluir">
                                                                {deleteConfirmId === a.id ? <span className="text-[8px] font-black uppercase">Excluir?</span> : <Trash2 size={14}></Trash2>}
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Gestão de Categorias */}
                                    <div className="glass-card p-8 md:p-10 rounded-[3rem] border-t-8 border-[#1A202C] space-y-6 h-fit bg-white">
                                         <div className="flex items-center gap-3 border-b border-slate-100 pb-4">
                                            <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-800"><i className="fa-solid fa-tags text-sm"></i></div>
                                            <h2 className="text-sm font-black uppercase tracking-wide">Plano de Categorias</h2>
                                        </div>
                                         <div className="flex flex-col sm:flex-row gap-3 pt-2">
                                             <input type="text" className="flex-1 p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-xs outline-none focus:border-black transition-colors" id="new-cat" placeholder="Ex: Matéria Prima, Embalagem..." />
                                             <button type="button" onClick={async()=>{const v=document.getElementById('new-cat').value.trim(); if(!v) return; setIsActionLoading(true); try { await db.ref('artifacts/'+appId+'/users/'+user.uid+'/categories').push({name:v}); document.getElementById('new-cat').value=''; } finally { setIsActionLoading(false); } }} className="bg-black hover:bg-slate-800 text-[#F8CC82] px-6 py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center shrink-0">
                                                <Plus size={18}></Plus> <span className="sm:hidden ml-2 text-xs font-black uppercase">Adicionar</span>
                                             </button>
                                         </div>
                                         <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[400px] overflow-y-auto no-scrollbar pt-4 border-t border-slate-100">
                                            {sortedCategories.length === 0 ? <p className="col-span-full py-8 text-center text-[10px] font-black uppercase text-slate-300">Nenhuma categoria registada</p> : sortedCategories.map(c => (
                                                <div key={c.id} className="p-3.5 bg-white border-2 border-slate-100 rounded-2xl flex justify-between items-center hover:border-black transition-colors group shadow-sm">
                                                    <span className="text-xs font-black uppercase text-slate-600 group-hover:text-black truncate pr-2" title={c.name}>{c.name}</span>
                                                    <button type="button" onClick={() => executeDelete('categories', c.id)} className={"shrink-0 flex items-center justify-center transition-all rounded-xl w-8 h-8 " + (deleteConfirmId === c.id ? 'delete-confirm w-auto px-3 bg-red-600 border border-red-700' : 'text-red-400 bg-red-50 hover:bg-red-100 border border-red-100 opacity-50 group-hover:opacity-100')} title="Excluir">
                                                        {deleteConfirmId === c.id ? <span className="text-[8px] font-black uppercase">Excluir?</span> : <Trash2 size={12}></Trash2>}
                                                    </button>
                                                </div>
                                            ))}
                                         </div>
                                    </div>

                                    {/* Ferramentas de Manutenção Avançada e Backups */}
                                    <div className="glass-card p-8 md:p-10 rounded-[3rem] border-t-8 border-teal-600 space-y-8 h-fit lg:col-span-2 bg-white shadow-xl relative overflow-hidden">
                                         <div className="absolute -right-10 -top-10 opacity-5 text-teal-600 pointer-events-none"><CloudLightning size={200}/></div>
                                         <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-6 relative z-10">
                                             <div className="flex items-center gap-4">
                                                 <div className="w-14 h-14 bg-teal-50 border border-teal-100 rounded-2xl flex items-center justify-center text-teal-600 shadow-inner"><CloudLightning size={24}/></div>
                                                 <div>
                                                     <h2 className="text-lg font-black uppercase tracking-tight text-slate-800">Centro de Segurança de Dados</h2>
                                                     <p className="text-[10px] font-bold text-slate-500 uppercase mt-1">Gere cópias físicas de segurança ou restaure o sistema via Firebase Realtime Database.</p>
                                                 </div>
                                             </div>
                                         </div>
                                         
                                         <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">
                                            {/* Painel Esquerdo: Backup Direto */}
                                            <div className="space-y-6 bg-slate-50 p-6 md:p-8 rounded-[2rem] border-2 border-slate-100 shadow-sm flex flex-col justify-between">
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 mb-4">
                                                        <span className="w-6 h-6 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-black text-xs">A</span>
                                                        <h3 className="text-sm font-black uppercase text-slate-700">Exportar Cópia (Backup Físico)</h3>
                                                    </div>
                                                    <p className="text-[10px] font-bold text-slate-500 uppercase leading-relaxed bg-white p-4 rounded-xl border border-slate-200">
                                                        Recomendamos gerar uma cópia física semanalmente. O sistema compilará todos os seus lançamentos, saldos, categorias e contas para um ficheiro JSON criptografado.
                                                    </p>
                                                </div>
                                                <button type="button" onClick={handleLiveExportBackup} className="w-full bg-teal-600 hover:bg-teal-700 text-white font-black text-[11px] uppercase p-5 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 mt-4 border-b-4 border-teal-800 active:border-b-0 active:mt-5">
                                                    <Download size={18}/> Descarregar Backup da Nuvem
                                                </button>
                                            </div>
                                            
                                            {/* Painel Direito: Restauro */}
                                            <div className="space-y-6 bg-slate-50 p-6 md:p-8 rounded-[2rem] border-2 border-slate-100 shadow-sm flex flex-col justify-between">
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 mb-4">
                                                        <span className="w-6 h-6 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center font-black text-xs">B</span>
                                                        <h3 className="text-sm font-black uppercase text-slate-700">Restaurar Ficheiro (.json)</h3>
                                                    </div>
                                                    <p className="text-[10px] font-bold text-slate-500 uppercase leading-relaxed bg-white p-4 rounded-xl border border-slate-200">
                                                        Selecione a cópia de segurança descarregada anteriormente para injetar os dados de volta na sua conta atual. Pode optar por mesclar ou apagar e substituir.
                                                    </p>
                                                </div>
                                                <div className="relative mt-4">
                                                    <input type="file" id="backup-file-upload" accept=".json" onChange={handleFileSelect} className="hidden" />
                                                    <label htmlFor="backup-file-upload" className="w-full bg-slate-800 hover:bg-black text-[#F8CC82] font-black text-[11px] uppercase p-5 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">
                                                        <i className="fa-solid fa-file-import text-sm"></i> Selecionar Ficheiro JSON
                                                    </label>
                                                </div>
                                            </div>
                                         </div>

                                         {/* Abaixo: Modo Avançado de Texto (Opção C) */}
                                         <div className="mt-4 pt-6 border-t border-slate-100 relative z-10">
                                            <details className="group bg-white border border-slate-200 rounded-[2rem] overflow-hidden shadow-sm">
                                                <summary className="p-5 flex items-center justify-between cursor-pointer font-black uppercase text-xs text-slate-600 bg-slate-50 hover:bg-slate-100 transition-colors list-none">
                                                    <span className="flex items-center gap-2"><i className="fa-solid fa-code text-slate-400"></i> Modo Avançado: Restauro por Texto (Código JSON)</span>
                                                    <i className="fa-solid fa-chevron-down text-slate-400 transition-transform group-open:rotate-180"></i>
                                                </summary>
                                                <div className="p-6 space-y-4 border-t border-slate-200">
                                                    <p className="text-[10px] font-bold text-slate-500 uppercase leading-relaxed">Útil se estiver a migrar dados exportados de ferramentas externas, ou scripts de migração.</p>
                                                    <textarea className="w-full h-32 p-4 bg-slate-900 text-green-400 border-2 border-slate-800 rounded-2xl font-mono text-[10px] outline-none shadow-inner focus:border-teal-500 transition-colors placeholder-slate-600" placeholder='Cole aqui a estrutura JSON válida. Ex: {"transactions": [...], "dailyRecords": {...}}' value={backupText} onChange={e=>setBackupText(e.target.value)}></textarea>
                                                    <button type="button" onClick={handleParseTextBackup} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-black text-[10px] uppercase py-3 px-6 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 ml-auto">
                                                        <i className="fa-solid fa-microchip"></i> Analisar Código Colado
                                                    </button>
                                                </div>
                                            </details>
                                         </div>

                                         {/* Painel de Aprovação de Restauro (Surge dinamicamente) */}
                                         {parsedBackup && (
                                             <div className="bg-amber-50 p-8 md:p-10 rounded-[3rem] border-2 border-amber-400 shadow-xl space-y-6 fade-in relative z-20 mt-8">
                                                 <div className="flex items-center gap-3 border-b border-amber-200 pb-4">
                                                     <div className="w-10 h-10 bg-amber-200 text-amber-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-triangle-exclamation"></i></div>
                                                     <div>
                                                         <h4 className="text-sm font-black text-amber-900 uppercase">Ficheiro Analisado e Pronto</h4>
                                                         <p className="text-[9px] font-bold text-amber-700 uppercase mt-1">Ação crítica para o ID Mestre: <span className="font-mono bg-amber-200 px-1 rounded text-black">{user.uid}</span></p>
                                                     </div>
                                                 </div>
                                                 
                                                 <div className="space-y-3">
                                                     <p className="text-[10px] font-black uppercase text-amber-800 ml-1">Selecione o método de injeção na base de dados:</p>
                                                     <div className="flex flex-col sm:flex-row gap-3">
                                                         <button type="button" onClick={()=>setBackupMode('merge')} className={"flex-1 p-5 rounded-2xl text-[10px] md:text-xs font-black uppercase border-2 transition-all flex flex-col items-center justify-center gap-2 shadow-sm " + (backupMode==='merge'?'bg-amber-500 border-amber-600 text-white transform scale-[1.02]':'bg-white text-slate-500 border-slate-200 hover:bg-slate-50')}>
                                                             <i className="fa-solid fa-object-group text-lg"></i>
                                                             <span>Mesclar (Adicionar aos Existentes)</span>
                                                         </button>
                                                         <button type="button" onClick={()=>setBackupMode('overwrite')} className={"flex-1 p-5 rounded-2xl text-[10px] md:text-xs font-black uppercase border-2 transition-all flex flex-col items-center justify-center gap-2 shadow-sm " + (backupMode==='overwrite'?'bg-red-600 border-red-700 text-white transform scale-[1.02]':'bg-white text-slate-500 border-slate-200 hover:bg-slate-50')}>
                                                             <i className="fa-solid fa-skull-crossbones text-lg"></i>
                                                             <span>Apagar Tudo e Substituir</span>
                                                         </button>
                                                     </div>
                                                 </div>
                                                 
                                                 <div className="pt-4">
                                                     <button type="button" onClick={handleExecuteRestore} className="w-full bg-black hover:bg-slate-800 text-amber-400 font-black text-sm md:text-base uppercase py-5 rounded-[2rem] shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-3 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">
                                                         <i className="fa-solid fa-database"></i> Confirmar Injeção de Dados
                                                     </button>
                                                     <button type="button" onClick={()=>{setParsedBackup(null); setBackupText('');}} className="w-full text-center text-[10px] font-black text-amber-700 uppercase hover:underline mt-4 p-2">Cancelar Operação</button>
                                                 </div>
                                             </div>
                                         )}

                                         {/* Log de Terminal do Processo */}
                                         {backupLog && (
                                             <div className="space-y-3 pt-6 relative z-10 fade-in">
                                                 <label className="text-[10px] font-black uppercase text-slate-500 flex items-center gap-2"><i className="fa-solid fa-terminal"></i> Terminal de Processamento Remoto</label>
                                                 <pre className="terminal-box h-48 overflow-y-auto no-scrollbar whitespace-pre-wrap">{backupLog}</pre>
                                                 {restoreProgress > 0 && (
                                                     <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden shadow-inner border border-slate-300">
                                                         <div className="bg-teal-500 h-full transition-all duration-300 relative overflow-hidden" style={{width: restoreProgress + "%"}}>
                                                             <div className="absolute inset-0 bg-white/20 w-full h-full" style={{animation: 'pulse 1s infinite'}}></div>
                                                         </div>
                                                     </div>
                                                 )}
                                             </div>
                                         )}
                                    </div>
                                </div>
                            )}
                        </main>
                    )}
                    <footer className="py-8 text-center opacity-30 font-black text-[9px] uppercase tracking-[0.5em]">Tribo Burger Financeiro • v2.8.6 GOLDEN STABLE</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
