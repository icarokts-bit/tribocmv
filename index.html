<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Scripts do Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;800&display=swap');
        
        body, input:not([type="password"]), select, button, textarea, option, span, p, h1, h2, h3, h4, th, td { 
            text-transform: uppercase !important; 
        }
        
        input::placeholder, textarea::placeholder {
            text-transform: uppercase !important;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCF9; color: #1A202C; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.6); }
        .tab-active { background-color: #1A202C; color: #F8CC82; border-radius: 14px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .table-input { width: 100%; height: 100%; text-align: center; background: transparent; border: none; font-weight: 800; font-size: 11px; outline: none; padding: 4px; }
        .table-input:focus { background-color: rgba(211, 226, 152, 0.2); }
        .header-black { background-color: #000; color: #FFF; font-weight: 800; text-transform: uppercase; font-size: 10px; border: 1px solid #333; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .stat-banner { background: #1A202C; border-bottom: 6px solid #D97757; color: white; padding: 2rem; border-radius: 2.5rem; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .status-badge { font-size: 7px; font-weight: 900; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        .delete-confirm { background-color: #EF4444 !important; color: white !important; animation: pulse 1s infinite; font-size: 9px !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); pointer-events: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .scale-up-center { animation: scale-up-center 0.2s cubic-bezier(0.390, 0.575, 0.565, 1.000) both; }
        @keyframes scale-up-center { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        
        .terminal-box { background-color: #0d1117; border: 1px solid #30363d; color: #58a6ff; font-family: 'Courier New', Courier, monospace; font-size: 11px; padding: 1rem; border-radius: 1rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tribo-burger-financeiro';
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyA1HkiCs0F4BkHeDNVNHNuhG0Ktd2VQDLU",
            authDomain: "tribocmv.firebaseapp.com",
            projectId: "tribocmv",
            databaseURL: "https://tribocmv-default-rtdb.firebaseio.com",
            storageBucket: "tribocmv.firebasestorage.app",
            messagingSenderId: "740375597526",
            appId: "1:740375597526:web:f826bba62245da21f0d477"
        };

        const configToUse = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;

        if (!firebase.apps.length) {
            firebase.initializeApp(configToUse);
        }
        const auth = firebase.auth();
        const db = firebase.database(); // Usando Realtime Database como na imagem

        // Componente base de Ícones Lucide
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        node: containerRef.current,
                        attrs: { width: size, height: size, class: className }
                    });
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center"></span>;
        };

        const safeIcons = [
            'Utensils', 'Sprout', 'Edit', 'Edit2', 'Trash', 'Trash2', 'Plus', 'Check', 'Search', 
            'Bell', 'Calendar', 'CreditCard', 'TrendingUp', 'CheckSquare', 'PlusCircle', 
            'CalendarDays', 'ShoppingCart', 'CheckCircle', 'Lock', 'ShieldCheck', 'Copy', 'Download', 'CloudLightning'
        ];
        
        const IconComponents = {};
        safeIcons.forEach(iconName => {
            const normalized = iconName.toLowerCase()
                .replace('2', '-2')
                .replace('square', '-square')
                .replace('circle', '-circle')
                .replace('days', '-days')
                .replace('card', '-card')
                .replace('up', '-up')
                .replace('check', '-check')
                .replace('lightning', '-lightning');
                
            IconComponents[iconName] = (props) => (
                <Icon name={normalized} size={props.size || 20} className={props.className || ""} />
            );
        });

        const { 
            Utensils, Sprout, Edit, Edit2, Trash, Trash2, Plus, Check, Search, Bell, Calendar, 
            CreditCard, TrendingUp, CheckSquare, PlusCircle, CalendarDays, ShoppingCart, 
            CheckCircle, Lock, ShieldCheck, Copy, Download, CloudLightning
        } = IconComponents;

        const parseDateUTC = (dateStr) => {
            if (!dateStr || dateStr.includes('NaN')) return new Date();
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                if (parts[0].length === 4) {
                    const y = parseInt(parts[0]);
                    const m = parseInt(parts[1]) - 1;
                    const d = parseInt(parts[2]);
                    if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
                        return new Date(Date.UTC(y, m, d));
                    }
                }
            }
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts[2].length === 4) {
                    const d = parseInt(parts[0]);
                    const m = parseInt(parts[1]) - 1;
                    const y = parseInt(parts[2]);
                    if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
                        return new Date(Date.UTC(y, m, d));
                    }
                }
            }
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? new Date() : d;
        };

        const getTransactionDates = (t, cardInfo) => {
            if (!t) return { clearanceDate: '', billingMonth: '' };
            
            if (isInvoicePayment(t)) {
                return {
                    clearanceDate: t.clearanceDate || t.date || '',
                    billingMonth: t.billingMonth || (t.date ? t.date.slice(0, 7) : '')
                };
            }

            if (!cardInfo || cardInfo.type !== 'cartao') {
                return {
                    clearanceDate: t.clearanceDate || t.date || '',
                    billingMonth: t.billingMonth || (t.date ? t.date.slice(0, 7) : '')
                };
            }
            
            const closing = parseInt(cardInfo.closing || cardInfo.closingDay || 25);
            const due = parseInt(cardInfo.due || cardInfo.dueDay || 10);
            
            const tDateStr = t.date || t.timestamp?.slice(0, 10) || new Date().toISOString().split('T')[0];
            const d = parseDateUTC(tDateStr);
            if (isNaN(d.getTime())) {
                return { clearanceDate: t.date || '', billingMonth: (t.date ? t.date.slice(0, 7) : '') };
            }
            
            let billingDate = new Date(d.getTime());
            billingDate.setUTCDate(1); 
            
            const day = d.getUTCDate();
            if (day > closing) {
                billingDate.setUTCMonth(billingDate.getUTCMonth() + 1);
            }
            
            const bYear = billingDate.getUTCFullYear();
            const bMonth = String(billingDate.getUTCMonth() + 1).padStart(2, '0');
            const billingMonth = bYear + "-" + bMonth;
            
            let dueDate = new Date(billingDate.getTime());
            dueDate.setUTCDate(1);
            if (due < closing) {
                dueDate.setUTCMonth(dueDate.getUTCMonth() + 1);
            }
            dueDate.setUTCDate(due);
            
            const clYear = dueDate.getUTCFullYear();
            const clMonth = String(dueDate.getUTCMonth() + 1).padStart(2, '0');
            const clDay = String(dueDate.getUTCDate()).padStart(2, '0');
            const clearanceDate = clYear + "-" + clMonth + "-" + clDay;
            
            return { clearanceDate, billingMonth };
        };

        const isInvoicePayment = (t) => {
            if (!t) return false;
            const desc = (t.description || "").toLowerCase();
            const cat = (t.category || "").toLowerCase();
            return (
                desc.includes("baixa fatura") || 
                desc.includes("pagamento fatura") || 
                desc.includes("pagamento de fatura") || 
                desc.includes("baixafatura") ||
                desc.includes("faturabaixa") ||
                desc.includes("pagamentobaixa") ||
                desc.includes("baixa de fatura") ||
                desc.includes("baixa") ||
                cat.includes("baixa fatura")
            );
        };

        const findCollectionsInJSON = (obj) => {
            if (!obj || typeof obj !== 'object') return null;

            let found = { transactions: null, dailyRecords: null, accounts: null, categories: null, suppliers: null };

            function search(current) {
                if (!current || typeof current !== 'object') return;

                if (current.transactions !== undefined && current.transactions !== null) found.transactions = current.transactions;
                if (current.dailyRecords !== undefined && current.dailyRecords !== null) found.dailyRecords = current.dailyRecords;
                if (current.accounts !== undefined && current.accounts !== null) found.accounts = current.accounts;
                if (current.categories !== undefined && current.categories !== null) found.categories = current.categories;
                if (current.suppliers !== undefined && current.suppliers !== null) found.suppliers = current.suppliers;

                const keys = Object.keys(current);
                for (let k of keys) {
                    if (current[k] && typeof current[k] === 'object') {
                        if (k !== 'transactions' && k !== 'dailyRecords' && k !== 'accounts' && k !== 'categories' && k !== 'suppliers') {
                            search(current[k]);
                        }
                    }
                }
            }

            search(obj);
            return found;
        };

        const normalizeCollection = (data, type) => {
            if (!data) return type === 'dailyRecords' ? {} : [];
            if (Array.isArray(data)) return data.filter(item => item !== null && typeof item === 'object');

            if (typeof data === 'object') {
                if (type === 'dailyRecords') {
                    const clean = {};
                    for (let [dateKey, val] of Object.entries(data)) {
                        if (val && typeof val === 'object') clean[dateKey] = val;
                    }
                    return clean;
                } else {
                    const arr = [];
                    for (let [key, val] of Object.entries(data)) {
                        if (val && typeof val === 'object') arr.push(Object.assign({ id: key }, val));
                    }
                    return arr;
                }
            }
            return type === 'dailyRecords' ? {} : [];
        };

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isActionLoading, setIsActionLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('manual'); 

            const [transactions, setTransactions] = useState([]);
            const [dailyRecords, setDailyRecords] = useState({});
            const [accounts, setAccounts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [suppliers, setSuppliers] = useState([]);
            const [metaVendas, setMetaVendas] = useState(0);

            const [filterMonth, setFilterMonth] = useState(new Date().toISOString().slice(0, 7));
            const [searchQuery, setSearchQuery] = useState('');
            const [typeFilter, setTypeFilter] = useState('todos');
            const [accFilter, setAccFilter] = useState('');
            const [catFilter, setCatFilter] = useState('');
            const [hideCards, setHideCards] = useState(false);
            const [hideForecasts, setHideForecasts] = useState(false);

            const [visibleCount, setVisibleCount] = useState(30);

            const [desc, setDesc] = useState('');
            const [val, setVal] = useState('');
            const [type, setType] = useState('saida');
            const [account, setAccount] = useState('');
            const [destAcc, setDestAcc] = useState('');
            const [cat, setCat] = useState('');
            const [sup, setSup] = useState('');
            const [status, setStatus] = useState('pago');
            const [inst, setInst] = useState(1);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [clearance, setClearance] = useState(new Date().toISOString().split('T')[0]);
            const [editingId, setEditingId] = useState(null);

            const [newDayDate, setNewDayDate] = useState(new Date().toISOString().split('T')[0]);
            const [accForm, setAccForm] = useState({ id: null, name: '', type: 'corrente', group: 'operacional', closing: '25', due: '10', pos: '1', highlight: false });
            const [accFormError, setAccFormError] = useState('');
            const [supplierInput, setSupplierInput] = useState('');

            const [liqModal, setLiqModal] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const [invoiceModal, setInvoiceModal] = useState(null);
            const [invoicePayType, setInvoicePayType] = useState('integral'); 
            const [invoicePartialVal, setInvoicePartialVal] = useState('');
            const [invoiceSourceAcc, setInvoiceSourceAcc] = useState('');

            const [backupText, setBackupText] = useState('');
            const [parsedBackup, setParsedBackup] = useState(null);
            const [backupLog, setBackupLog] = useState('');
            const [backupMode, setBackupMode] = useState('merge');
            const [restoreProgress, setRestoreProgress] = useState(0);
            const [copyRulesSuccess, setCopyRulesSuccess] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(u => { 
                    setUser(u); 
                    setLoading(false);
                    if (u) setAuthMode('auto');
                    else setAuthMode('manual');
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const activeUid = user.uid;
                const path = "artifacts/" + appId + "/users/" + activeUid;
                
                // Mudei as chamadas de db.collection para db.ref para o Realtime Database
                const unsubTx = db.ref(path + "/transactions").on('value', s => {
                    const data = s.val();
                    if(data) {
                        setTransactions(Object.keys(data).map(key => ({id: key, ...data[key]})));
                    } else {
                        setTransactions([]);
                    }
                });
                
                const unsubDaily = db.ref(path + "/dailyRecords").on('value', s => { 
                    const data = s.val() || {};
                    setDailyRecords(data); 
                });
                
                const unsubAcc = db.ref(path + "/accounts").on('value', s => { 
                    const data = s.val();
                    if(data) setAccounts(Object.keys(data).map(key => ({id: key, ...data[key]})));
                    else setAccounts([]);
                });
                
                const unsubCat = db.ref(path + "/categories").on('value', s => { 
                    const data = s.val();
                    if(data) setCategories(Object.keys(data).map(key => ({id: key, ...data[key]})));
                    else setCategories([]);
                });
                
                const unsubSup = db.ref(path + "/suppliers").on('value', s => { 
                    const data = s.val();
                    if(data) setSuppliers(Object.keys(data).map(key => ({id: key, ...data[key]})));
                    else setSuppliers([]);
                });
                
                const unsubMeta = db.ref(path + "/settings/config").on('value', s => { 
                    const data = s.val();
                    if(data && data.meta) setMetaVendas(data.meta); 
                });

                return () => { 
                    db.ref(path + "/transactions").off('value', unsubTx);
                    db.ref(path + "/dailyRecords").off('value', unsubDaily);
                    db.ref(path + "/accounts").off('value', unsubAcc);
                    db.ref(path + "/categories").off('value', unsubCat);
                    db.ref(path + "/suppliers").off('value', unsubSup);
                    db.ref(path + "/settings/config").off('value', unsubMeta);
                };
            }, [user]);

            useEffect(() => {
                setVisibleCount(30);
            }, [filterMonth, searchQuery, typeFilter, accFilter, catFilter, hideCards, hideForecasts]);

            const p = (v) => parseFloat(String(v || 0).replace(',', '.')) || 0;
            const formatMoney = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

            const sortedCategories = useMemo(() => {
                return [...categories].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
            }, [categories]);

            const uniqueDescriptions = useMemo(() => {
                const descs = transactions.map(t => t.description).filter(Boolean);
                return [...new Set(descs)].sort();
            }, [transactions]);

            const filteredDashboard = useMemo(() => {
                return transactions.filter(t => {
                    if (!t) return false;
                    const accInfo = accounts.find(a => a.name === t.account);
                    const { clearanceDate, billingMonth } = getTransactionDates(t, accInfo);
                    
                    const isMonth = (t.date?.startsWith(filterMonth) || clearanceDate?.startsWith(filterMonth) || billingMonth === filterMonth);
                    const matchSearch = (t.description || "").toLowerCase().includes(searchQuery.toLowerCase()) || (t.category || "").toLowerCase().includes(searchQuery.toLowerCase());
                    const matchType = typeFilter === 'todos' || t.type === typeFilter;
                    const matchAcc = accFilter === '' || t.account === accFilter;
                    const matchCat = catFilter === '' || t.category === catFilter;
                    const filterCard = hideCards ? accInfo?.type !== 'cartao' : true;
                    const filterForecast = hideForecasts ? t.status === 'pago' : true;
                    return isMonth && matchSearch && matchType && matchAcc && matchCat && filterCard && filterForecast;
                }).sort((a,b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
            }, [transactions, filterMonth, searchQuery, typeFilter, accFilter, catFilter, hideCards, hideForecasts, accounts]);

            const filteredSummary = useMemo(() => {
                let entradas = 0; let saidas = 0; let transfs = 0;
                filteredDashboard.forEach(t => {
                    const v = p(t.amount);
                    if (t.type === 'entrada') entradas += v;
                    else if (t.type === 'saida') saidas += v;
                    else if (t.type === 'transferencia') transfs += v;
                });
                return { entradas, saidas, transfs, saldo: entradas - saidas };
            }, [filteredDashboard]);

            const displayedTransactions = useMemo(() => {
                return filteredDashboard.slice(0, visibleCount);
            }, [filteredDashboard, visibleCount]);

            const accountBalances = useMemo(() => {
                const bal = {}; 
                if (accounts) accounts.forEach(a => { if(a.name) bal[a.name] = 0; });
                transactions.forEach(t => {
                    if (t.status === 'pago') {
                        const amt = p(t.amount);
                        if (t.type === 'entrada') bal[t.account] = (bal[t.account] || 0) + amt;
                        else if (t.type === 'saida') bal[t.account] = (bal[t.account] || 0) - amt;
                        else if (t.type === 'transferencia') { 
                            bal[t.account] = (bal[t.account] || 0) - amt; 
                            bal[t.destinationAccount] = (bal[t.destinationAccount] || 0) + amt; 
                        }
                    }
                });
                return bal;
            }, [transactions, accounts]);

            const totalPatrimony = useMemo(() => {
                return accounts.filter(a => a.type === 'corrente').reduce((acc, a) => acc + (accountBalances[a.name] || 0), 0);
            }, [accounts, accountBalances]);

            const stats = useMemo(() => {
                let rb = 0; let custos = 0; let catCosts = {}; let diasAtivos = 0; let totalPedidos = 0;
                let entradas = 0; let contasPagas = 0;

                Object.keys(dailyRecords).forEach(d => {
                    if (d.startsWith(filterMonth)) {
                        const r = dailyRecords[d];
                        const totalDia = ['pix','pixOnline','fiado','dinheiro','ifood','debito','credito','vr','ticket','alelo'].reduce((s,f)=>s+p(r[f]), 0);
                        if (totalDia > 0) diasAtivos++;
                        rb += totalDia;
                        custos += p(r.motoboy) + p(r.taxaEntrega);
                        totalPedidos += p(r.qtdPedidos);
                    }
                });

                transactions.forEach(t => {
                    const accInfo = accounts.find(a => a.name === t.account);
                    const { clearanceDate } = getTransactionDates(t, accInfo);
                    
                    if (t.status === 'pago' && (t.date?.startsWith(filterMonth) || clearanceDate?.startsWith(filterMonth))) {
                        if (t.type === 'saida') {
                            catCosts[t.category] = (catCosts[t.category] || 0) + p(t.amount);
                            contasPagas += p(t.amount);
                        } else if (t.type === 'entrada') {
                            if (!isInvoicePayment(t)) {
                                entradas += p(t.amount);
                            }
                        }
                    }
                });

                const operCosts = Object.values(catCosts).reduce((a,b)=>a+b, 0);
                
                return { 
                    rb, totalCosts: operCosts + custos, lucro: rb - (operCosts + custos), 
                    catCosts, diasAtivos, totalPedidos,
                    ticketDiario: diasAtivos > 0 ? rb / diasAtivos : 0,
                    ticketPedido: totalPedidos > 0 ? rb / totalPedidos : 0,
                    entradas, contasPagas, lucroCaixa: entradas - contasPagas
                };
            }, [dailyRecords, transactions, filterMonth]);

            const columnTotals = useMemo(() => {
                const days = Object.keys(dailyRecords).filter(d => d.startsWith(filterMonth));
                const totals = { totalDia: 0, pedidos: 0, pix: 0, pixOnline: 0, fiado: 0, dinero: 0, dinheiro: 0, ifood: 0, debito: 0, credito: 0, vr: 0, ticket: 0, alelo: 0, taxaEntrega: 0, motoboy: 0 };
                days.forEach(d => {
                    const r = dailyRecords[d] || {};
                    totals.totalDia += ['pix','pixOnline','fiado','dinheiro','ifood','debito','credito','vr','ticket','alelo'].reduce((acc,f)=>acc+p(r[f]), 0);
                    totals.pedidos += p(r.qtdPedidos);
                    ['pix','pixOnline','fiado','dinheiro','ifood','debito','credito','vr','ticket','alelo'].forEach(f => { totals[f] += p(r[f]); });
                    totals.taxaEntrega += p(r.taxaEntrega); totals.motoboy += p(r.motoboy);
                });
                totals.ticketMedio = totals.pedidos > 0 ? totals.totalDia / totals.pedidos : 0;
                return totals;
            }, [dailyRecords, filterMonth]);

            const consolidatedAPagar = useMemo(() => {
                const pendings = transactions.filter(t => {
                    const accInfo = accounts.find(a => a.name === t.account);
                    const { clearanceDate } = getTransactionDates(t, accInfo);
                    return t.type === 'saida' && t.status === 'pendente' && clearanceDate?.startsWith(filterMonth) && accInfo?.type !== 'cartao';
                });
                
                const invoices = accounts.filter(a => a.type === 'cartao').map(card => {
                    const txs = transactions.filter(t => {
                        if (t.account !== card.name) return false;
                        const { clearanceDate } = getTransactionDates(t, card);
                        return clearanceDate?.startsWith(filterMonth);
                    });
                    
                    const totalPurchases = txs.filter(t => !isInvoicePayment(t)).reduce((acc, t) => t.type === 'saida' ? acc + p(t.amount) : acc - p(t.amount), 0);
                    const totalPaid = txs.filter(t => isInvoicePayment(t)).reduce((acc, t) => t.type === 'entrada' ? acc + p(t.amount) : acc - p(t.amount), 0);
                    const remaining = totalPurchases - totalPaid;
                    
                    if (remaining <= 0.01) return null;
                    
                    const cardDueDay = card.due || card.dueDay || 10;
                    return { 
                        id: "card-" + card.name, 
                        description: "Fatura " + card.name, 
                        amount: remaining, 
                        account: card.name, 
                        clearanceDate: filterMonth + "-" + String(cardDueDay).padStart(2, '0'), 
                        isInvoice: true 
                    };
                }).filter(Boolean);
                
                return [...pendings, ...invoices].sort((a,b) => (a.clearanceDate || "").localeCompare(b.clearanceDate || ""));
            }, [transactions, accounts, filterMonth]);

            const alerts = useMemo(() => {
                const today = new Date();
                const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
                const MS_PER_DAY = 24 * 60 * 60 * 1000;
                const items = [];

                transactions.forEach(t => {
                    if (t.status === 'pendente') {
                        const accInfo = accounts.find(a => a.name === t.account);
                        const { clearanceDate } = getTransactionDates(t, accInfo);
                        if (clearanceDate && (t.type === 'saida' || t.type === 'entrada') && accInfo?.type !== 'cartao') {
                            const dueD = parseDateUTC(clearanceDate);
                            const dueUTC = Date.UTC(dueD.getUTCFullYear(), dueD.getUTCMonth(), dueD.getUTCDate());
                            const diffDays = Math.round((dueUTC - todayUTC) / MS_PER_DAY);
                            if (diffDays <= 2) {
                                items.push({ id: t.id, description: t.description, amount: p(t.amount), type: t.type, clearanceDate, diffDays, account: t.account });
                            }
                        }
                    }
                });

                accounts.filter(a => a.type === 'cartao').forEach(card => {
                    const txs = transactions.filter(t => {
                        if (t.account !== card.name) return false;
                        const { clearanceDate } = getTransactionDates(t, card);
                        return clearanceDate?.startsWith(filterMonth);
                    });
                    const totalPurchases = txs.filter(t => !isInvoicePayment(t)).reduce((acc, t) => t.type === 'saida' ? acc + p(t.amount) : acc - p(t.amount), 0);
                    const totalPaid = txs.filter(t => isInvoicePayment(t)).reduce((acc, t) => t.type === 'entrada' ? acc + p(t.amount) : acc - p(t.amount), 0);
                    const remaining = totalPurchases - totalPaid;
                    
                    if (remaining > 0.01) {
                        const cardDueDay = card.due || card.dueDay || card.closing || 10;
                        const clearanceDate = filterMonth + "-" + String(cardDueDay).padStart(2, '0');
                        const dueD = parseDateUTC(clearanceDate);
                        const dueUTC = Date.UTC(dueD.getUTCFullYear(), dueD.getUTCMonth(), dueD.getUTCDate());
                        const diffDays = Math.round((dueUTC - todayUTC) / MS_PER_DAY);
                        if (diffDays <= 2) {
                            items.push({ id: "card-alert-" + card.name, description: "Fatura " + card.name, amount: remaining, type: 'saida', clearanceDate, diffDays, account: card.name, isInvoice: true });
                        }
                    }
                });
                return items.sort((a, b) => a.diffDays - b.diffDays);
            }, [transactions, accounts, filterMonth]);

            const handleManualLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                setIsActionLoading(true);
                
                if (isRegistering) {
                    auth.createUserWithEmailAndPassword(email, password)
                        .then(() => { setIsActionLoading(false); })
                        .catch(err => { setAuthError(err.message); setIsActionLoading(false); });
                } else {
                    auth.signInWithEmailAndPassword(email, password)
                        .then(() => { setIsActionLoading(false); })
                        .catch(err => { setAuthError(err.message); setIsActionLoading(false); });
                }
            };

            const handleSaveTx = async (e) => {
                e.preventDefault();
                if (!user || !val) return;
                setIsActionLoading(true);
                try {
                    const activeUid = user.uid;
                    const path = "artifacts/" + appId + "/users/" + activeUid + "/transactions";
                    const cardInfo = accounts.find(a => a.name === account && a.type === 'cartao');
                    
                    const numInst = (type === 'transferencia') ? 1 : (parseInt(inst) || 1);
                    const baseDateString = date || new Date().toISOString().split('T')[0];
                    const parts = baseDateString.split('-');
                    const year = parseInt(parts[0]) || new Date().getFullYear();
                    const month = parseInt(parts[1]) || (new Date().getMonth() + 1);
                    const day = parseInt(parts[2]) || new Date().getDate();

                    for (let i = 0; i < numInst; i++) {
                        let d = new Date(Date.UTC(year, month - 1 + i, day));
                        const finalTxDate = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, '0') + "-" + String(d.getUTCDate()).padStart(2, '0');
                        let finalClearance = clearance || baseDateString;
                        let billingM = finalTxDate.slice(0, 7);
                        
                        if (cardInfo) {
                            const closing = parseInt(cardInfo.closing || cardInfo.closingDay || 25);
                            const due = parseInt(cardInfo.due || cardInfo.dueDay || 10);
                            let billingDate = new Date(d.getTime()); billingDate.setUTCDate(1); 
                            if (d.getUTCDate() > closing) billingDate.setUTCMonth(billingDate.getUTCMonth() + 1);
                            billingM = billingDate.getUTCFullYear() + "-" + String(billingDate.getUTCMonth() + 1).padStart(2, '0');
                            let dueDate = new Date(billingDate.getTime()); dueDate.setUTCDate(1);
                            if (due < closing) dueDate.setUTCMonth(dueDate.getUTCMonth() + 1);
                            dueDate.setUTCDate(due);
                            finalClearance = dueDate.getUTCFullYear() + "-" + String(dueDate.getUTCMonth() + 1).padStart(2, '0') + "-" + String(dueDate.getUTCDate()).padStart(2, '0');
                        } else {
                            if (clearance) {
                                const clParts = clearance.split('-');
                                const clY = parseInt(clParts[0]) || year;
                                const clM = parseInt(clParts[1]) || month;
                                const clD = parseInt(clParts[2]) || day;
                                let clDate = new Date(Date.UTC(clY, clM - 1 + i, clD));
                                finalClearance = clDate.getUTCFullYear() + "-" + String(clDate.getUTCMonth() + 1).padStart(2, '0') + "-" + String(clDate.getUTCDate()).padStart(2, '0');
                            } else finalClearance = finalTxDate;
                        }

                        const payload = {
                            description: numInst > 1 ? desc + " (" + (i+1) + "/" + numInst + ")" : desc,
                            amount: p(val) / numInst, type, 
                            status: (cardInfo || type === 'entrada' || status === 'pendente') ? 'pendente' : status,
                            date: finalTxDate, clearanceDate: finalClearance, billingMonth: billingM,
                            account, destinationAccount: destAcc, category: type === 'transferencia' ? 'Transferência' : (cat || 'Geral'), supplier: sup, timestamp: new Date().toISOString()
                        };
                        
                        if (editingId && i === 0) {
                            await db.ref(path + "/" + editingId).update(payload);
                        } else {
                            await db.ref(path).push(payload);
                        }
                    }
                    setEditingId(null); setDesc(''); setVal(''); setType('saida'); setAccount(''); setDestAcc(''); setCat(''); setSup(''); setInst(1);
                } catch (err) { console.error(err); } finally { setIsActionLoading(false); }
            };

            const handleExecuteInvoicePayment = async () => {
                if (!user || !invoiceModal || !invoiceSourceAcc) return;
                setIsActionLoading(true);
                try {
                    const activeUid = user.uid;
                    const path = "artifacts/" + appId + "/users/" + activeUid + "/transactions";
                    const totalInvoiceAmount = invoiceModal.total;
                    const paidAmount = invoicePayType === 'integral' ? totalInvoiceAmount : p(invoicePartialVal);

                    if (paidAmount <= 0) { setIsActionLoading(false); return; }

                    const todayStr = new Date().toISOString().split('T')[0];

                    const paymentPayload = {
                        description: "Baixa Fatura " + invoiceModal.cardName + " (" + invoicePayType.toUpperCase() + ")",
                        amount: paidAmount, type: 'saida', status: 'pago',
                        date: todayStr, clearanceDate: todayStr, billingMonth: filterMonth,
                        account: invoiceSourceAcc, category: 'Baixa Fatura', supplier: '', timestamp: new Date().toISOString()
                    };
                    await db.ref(path).push(paymentPayload);

                    const cardCreditPayload = {
                        description: "Pagamento de Fatura Mês " + filterMonth,
                        amount: paidAmount, type: 'entrada', status: 'pago',
                        date: todayStr, clearanceDate: filterMonth + "-28", billingMonth: filterMonth,
                        account: invoiceModal.cardName, category: 'Baixa Fatura', supplier: '', timestamp: new Date().toISOString()
                    };
                    await db.ref(path).push(cardCreditPayload);

                    if (invoicePayType === 'parcial' && (totalInvoiceAmount - paidAmount) > 0.01) {
                        const remainingAmount = totalInvoiceAmount - paidAmount;
                        const parts = filterMonth.split('-');
                        let nextM = parseInt(parts[1]) + 1;
                        let nextY = parseInt(parts[0]);
                        if (nextM > 12) { nextM = 1; nextY += 1; }
                        const nextMonthStr = nextY + "-" + String(nextM).padStart(2, '0');

                        const rolloverPayload = {
                            description: "Saldo Restante Fatura Anterior " + filterMonth,
                            amount: remainingAmount, type: 'saida', status: 'pendente',
                            date: nextMonthStr + "-01", clearanceDate: nextMonthStr + "-10", billingMonth: nextMonthStr,
                            account: invoiceModal.cardName, category: 'Saldo Fatura Anterior', supplier: '', timestamp: new Date().toISOString()
                        };
                        await db.ref(path).push(rolloverPayload);
                    }

                    setInvoiceModal(null); setInvoicePartialVal(''); setInvoiceSourceAcc('');
                } catch(e) { console.error(e); } finally { setIsActionLoading(false); }
            };

            const startEdit = (t) => {
                setEditingId(t.id); setDesc(t.description || ''); setVal(t.amount ? t.amount.toString() : ''); setType(t.type || 'saida'); setAccount(t.account || ''); setDestAcc(t.destinationAccount || ''); setCat(t.category || ''); setSup(t.supplier || ''); setDate(t.date || new Date().toISOString().split('T')[0]); setClearance(t.clearanceDate || new Date().toISOString().split('T')[0]); setStatus(t.status || 'pago');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const seedToForm = (t) => {
                setEditingId(null); setDesc(t.description || ''); setVal(t.amount ? t.amount.toString() : ''); setType(t.type || 'saida'); setAccount(t.account || ''); setDestAcc(t.destinationAccount || ''); setCat(t.category || ''); setSup(t.supplier || '');
                const todayStr = new Date().toISOString().split('T')[0]; setDate(todayStr); setClearance(todayStr); setStatus('pago');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleOpenNewDay = async () => {
                if (!user) return; setIsActionLoading(true);
                const activeUid = user.uid;
                try { await db.ref('artifacts/' + appId + '/users/' + activeUid + '/dailyRecords/' + newDayDate).update({ initialized: true }); } finally { setIsActionLoading(false); }
            };

            const openLiquidation = (t) => {
                if (t.isInvoice) { setActiveTab('cartoes'); return; }
                setLiqModal({ id: t.id, description: t.description || 'Sem Descrição', amount: String(t.amount || 0).replace('.', ','), date: new Date().toISOString().split('T')[0] });
            };

            const executeLiquidation = async () => {
                if (!user || !liqModal) return;
                setIsActionLoading(true);
                const activeUid = user.uid;
                try {
                    await db.ref('artifacts/' + appId + '/users/' + activeUid + '/transactions/' + liqModal.id).update({ status: 'pago', clearanceDate: liqModal.date, amount: p(liqModal.amount) });
                    setLiqModal(null);
                } catch (e) { console.error(e); } finally { setIsActionLoading(false); }
            };

            const saveMeta = async (v) => { if (!user) return; const activeUid = user.uid; await db.ref('artifacts/' + appId + '/users/' + activeUid + '/settings/config').update({ meta: p(v) }); };

            const handleSaveAccount = async () => {
                if (!accForm.name) { setAccFormError('Defina um nome.'); return; }
                if (accounts.find(a => a.name.toLowerCase() === accForm.name.toLowerCase() && a.id !== accForm.id)) { setAccFormError('Já existe este nome.'); return; }
                setAccFormError(''); setIsActionLoading(true);
                const activeUid = user.uid;
                try {
                    const pth = db.ref('artifacts/' + appId + '/users/' + activeUid + '/accounts');
                    if (accForm.id) await pth.child(accForm.id).update(accForm); 
                    else await pth.push(accForm);
                    setAccForm({id: null, name: '', type: 'corrente', group: 'operacional', closing: '25', due: '10', pos: '1', highlight: false});
                } finally { setIsActionLoading(false); }
            };

            const executeDelete = async (collectionName, id) => {
                if (!user || !user.uid || !collectionName || !id) return;
                const activeUid = user.uid;
                if (deleteConfirmId === id) {
                    setIsActionLoading(true);
                    try { 
                        await db.ref('artifacts/' + appId + '/users/' + activeUid + '/' + collectionName + '/' + id).remove(); 
                        setDeleteConfirmId(null); 
                    } catch (e) { console.error("Erro na exclusão:", e); } finally { setIsActionLoading(false); }
                } else { 
                    setDeleteConfirmId(id); 
                    setTimeout(() => setDeleteConfirmId(prev => prev === id ? null : prev), 5000); 
                }
            };

            const handleParseTextBackup = () => {
                if (!backupText.trim()) return;
                try {
                    const parsed = JSON.parse(backupText);
                    if (!parsed) throw new Error("O texto JSON está vazio ou é inválido.");
                    const collections = findCollectionsInJSON(parsed);
                    const hasData = collections && (collections.transactions || collections.accounts || collections.dailyRecords);

                    if (hasData) {
                        const normalized = {
                            transactions: normalizeCollection(collections.transactions, 'transactions'),
                            accounts: normalizeCollection(collections.accounts, 'accounts'),
                            dailyRecords: normalizeCollection(collections.dailyRecords, 'dailyRecords'),
                            categories: normalizeCollection(collections.categories, 'categories'),
                            suppliers: normalizeCollection(collections.suppliers, 'suppliers')
                        };
                        setParsedBackup(normalized);
                        setBackupLog("✨ Sucesso ao ler Cópia de Segurança!\n- Transações detetadas: " + (normalized.transactions?.length || 0) + "\n");
                    } else { setBackupLog("JSON válido, mas não contém coleções do Tribo Burger."); }
                } catch(e) { setBackupLog("❌ Erro de formatação JSON: " + e.message); }
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setBackupLog(prev => prev + "A ler o ficheiro: " + file.name + "...\n");
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (!parsed) throw new Error("Ficheiro vazio ou inválido.");
                        const collections = findCollectionsInJSON(parsed);
                        const hasData = collections && (collections.transactions || collections.accounts || collections.dailyRecords);
                        
                        if (hasData) {
                            const normalized = {
                                transactions: normalizeCollection(collections.transactions, 'transactions'),
                                accounts: normalizeCollection(collections.accounts, 'accounts'),
                                dailyRecords: normalizeCollection(collections.dailyRecords, 'dailyRecords'),
                                categories: normalizeCollection(collections.categories, 'categories'),
                                suppliers: normalizeCollection(collections.suppliers, 'suppliers')
                            };
                            setParsedBackup(normalized);
                            setBackupLog(prev => prev + "✨ Ficheiro processado! Transações: " + (normalized.transactions?.length || 0) + "\n");
                        } else { setBackupLog(prev => prev + "⚠️ Sem coleções compatíveis.\n"); }
                    } catch(err) { setBackupLog(prev => prev + "❌ Erro ao processar: " + err.message + "\n"); }
                };
                reader.readAsText(file);
            };

            const handleExecuteRestore = async () => {
                if (!user || !parsedBackup) return;
                setIsActionLoading(true); setRestoreProgress(5);
                setBackupLog(prev => prev + "Iniciando gravação no ID: " + user.uid + "...\n");

                try {
                    const activeUid = user.uid;
                    const path = "artifacts/" + appId + "/users/" + activeUid;

                    if (backupMode === 'overwrite') {
                        setBackupLog(prev => prev + "Limpando registos anteriores...\n");
                        await db.ref(path + "/transactions").remove();
                        await db.ref(path + "/dailyRecords").remove();
                    }
                    setRestoreProgress(30);

                    const promises = [];

                    if (parsedBackup.accounts && parsedBackup.accounts.length > 0) {
                        for (const acc of parsedBackup.accounts) {
                            if (acc.name) {
                                promises.push(db.ref(path + "/accounts").push({
                                    name: acc.name, type: acc.type || 'corrente', group: acc.group || 'operacional', closing: acc.closing || '25', due: acc.due || '10', pos: acc.pos || '1', highlight: acc.highlight === 'true' || acc.highlight === true
                                }));
                            }
                        }
                    }
                    setRestoreProgress(50);

                    if (parsedBackup.categories) {
                        for (const cat of parsedBackup.categories) {
                            if (cat.name) promises.push(db.ref(path + "/categories").push({ name: cat.name }));
                        }
                    }
                    setRestoreProgress(70);

                    if (parsedBackup.suppliers) {
                        for (const sup of parsedBackup.suppliers) {
                            if (sup.name) promises.push(db.ref(path + "/suppliers").push({ name: sup.name }));
                        }
                    }

                    if (parsedBackup.dailyRecords) {
                        for (const day of Object.keys(parsedBackup.dailyRecords)) {
                            promises.push(db.ref(path + "/dailyRecords/" + day).update(parsedBackup.dailyRecords[day]));
                        }
                    }
                    setRestoreProgress(90);

                    if (parsedBackup.transactions) {
                        for (const tx of parsedBackup.transactions) {
                            const cleanTx = {
                                description: tx.description || 'Lançamento', amount: p(tx.amount), type: tx.type || 'saida', status: tx.status || 'pago', date: tx.date || new Date().toISOString().split('T')[0], clearanceDate: tx.clearanceDate || tx.date || new Date().toISOString().split('T')[0], billingMonth: tx.billingMonth || (tx.date ? tx.date.slice(0,7) : new Date().toISOString().slice(0,7)), account: tx.account || '', destinationAccount: tx.destinationAccount || '', category: tx.category || 'Geral', supplier: tx.supplier || '', timestamp: tx.timestamp || new Date().toISOString()
                            };
                            promises.push(db.ref(path + "/transactions").push(cleanTx));
                        }
                    }
                    
                    await Promise.all(promises);
                    setRestoreProgress(100);
                    setBackupLog(prev => prev + "\n✨ DADOS RESTAURADOS COM SUCESSO!");
                    setParsedBackup(null); setBackupText('');
                } catch (err) { setBackupLog(prev => prev + "\n❌ Erro ao gravar: " + err.message); } finally { setIsActionLoading(false); }
            };

            const copyToClipboard = (text, rulesType) => {
                const tempInput = document.createElement("textarea");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                setCopyRulesSuccess(rulesType);
                setTimeout(() => setCopyRulesSuccess(''), 3000);
            };

            const rtdbRulesTemplate = "{\n  \"rules\": {\n    \".read\": \"auth != null\",\n    \".write\": \"auth != null\"\n  }\n}";

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-[#1A202C] text-[#F8CC82] font-black uppercase tracking-widest">A carregar Tribo...</div>;

            return (
                <div className="min-h-screen flex flex-col fade-in">
                    {isActionLoading && <div className="loading-overlay text-white font-black uppercase text-xs">Processando...</div>}
                    
                    {liqModal && (
                        <div className="modal-overlay">
                            <div className="glass-card w-full max-w-sm p-8 rounded-[2.5rem] shadow-2xl border-t-8 border-green-500 flex flex-col gap-6 scale-up-center">
                                <div className="text-center">
                                    <h3 className="text-sm font-black uppercase text-slate-400 mb-1 tracking-widest">Confirmar Liquidação</h3>
                                    <p className="font-black text-lg text-slate-800 uppercase leading-tight">{liqModal.description}</p>
                                </div>
                                <div className="space-y-4">
                                    <div className="space-y-1"><label className="text-[9px] font-black uppercase text-slate-400 ml-2">Data da Liquidação</label><input type="date" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none" value={liqModal.date} onChange={e=>setLiqModal(Object.assign({}, liqModal, { date: e.target.value }))} /></div>
                                    <div className="space-y-1"><label className="text-[9px] font-black uppercase text-slate-400 ml-2">Valor Final (R$)</label><input type="text" className="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-xl text-center text-green-600 outline-none" value={liqModal.amount} onChange={e=>setLiqModal(Object.assign({}, liqModal, { amount: e.target.value }))} /></div>
                                </div>
                                <div className="flex flex-col gap-2">
                                    <button onClick={executeLiquidation} className="w-full bg-black text-[#F8CC82] p-5 rounded-2xl font-black uppercase text-xs shadow-lg active:scale-95 transition-all">Confirmar e Liquidar</button>
                                    <button onClick={()=>setLiqModal(null)} className="w-full text-slate-400 p-2 text-[9px] font-black uppercase hover:text-red-500">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {invoiceModal && (
                        <div className="modal-overlay">
                            <div className="glass-card w-full max-w-md p-8 rounded-[2.5rem] shadow-2xl border-t-8 border-orange-500 flex flex-col gap-5 scale-up-center">
                                <div className="text-center">
                                    <h3 className="text-[10px] font-black uppercase text-slate-400 mb-1 tracking-widest">PAGAMENTO DE FATURA</h3>
                                    <p className="font-black text-xl text-slate-800 uppercase">{invoiceModal.cardName}</p>
                                    <p className="text-[10px] font-bold text-[#D97757] uppercase bg-orange-50 rounded-full px-3 py-1 inline-block mt-1">Mês Base: {filterMonth}</p>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-2xl border flex justify-between items-center">
                                    <span className="text-xs font-black uppercase text-slate-500">Valor Total Fechado:</span>
                                    <span className="text-xl font-black text-slate-900">{formatMoney(invoiceModal.total)}</span>
                                </div>

                                <div className="space-y-2">
                                    <label className="text-[9px] font-black uppercase text-slate-400 ml-1">Modalidade de Pagamento</label>
                                    <div className="flex gap-2 bg-slate-100 p-1 rounded-xl">
                                        <button onClick={()=>setInvoicePayType('integral')} className={"flex-1 py-2 rounded-lg font-black text-[10px] uppercase transition-all " + (invoicePayType === "integral" ? "bg-black text-[#F8CC82] shadow" : "text-slate-400")}>INTEGRAL (TOTAL)</button>
                                        <button onClick={()=>setInvoicePayType('parcial')} className={"flex-1 py-2 rounded-lg font-black text-[10px] uppercase transition-all " + (invoicePayType === "parcial" ? "bg-orange-500 text-white shadow" : "text-slate-400")}>PARCIAL</button>
                                    </div>
                                </div>

                                {invoicePayType === 'parcial' && (
                                    <div className="space-y-1 fade-in">
                                        <label className="text-[9px] font-black uppercase text-slate-400 ml-1">Quanto deseja pagar agora? (R$)</label>
                                        <input type="text" className="w-full p-4 bg-white border-2 border-orange-100 rounded-2xl font-black text-lg text-center text-orange-600 outline-none" placeholder="0,00" value={invoicePartialVal} onChange={e=>setInvoicePartialVal(e.target.value)} />
                                        {p(invoicePartialVal) > 0 && <p className="text-[9px] font-bold text-red-500 text-center uppercase mt-1">* Restante de {formatMoney(invoiceModal.total - p(invoicePartialVal))} rolará para o próximo mês!</p>}
                                    </div>
                                )}

                                <div className="space-y-1">
                                    <label className="text-[9px] font-black uppercase text-slate-400 ml-1">Origem do Dinheiro (Conta Débito)</label>
                                    <select className="w-full p-4 bg-white border rounded-2xl font-black text-xs outline-none" value={invoiceSourceAcc} onChange={e=>setInvoiceSourceAcc(e.target.value)} required>
                                        <option value="">Selecione a conta bancária...</option>
                                        {accounts.filter(a => a.type === 'corrente').map(a=><option key={a.id} value={a.name}>{a.name} (Saldo: {formatMoney(accountBalances[a.name]||0)})</option>)}
                                    </select>
                                </div>

                                <div className="flex flex-col gap-2 pt-2">
                                    <button onClick={handleExecuteInvoicePayment} className="w-full bg-black text-[#F8CC82] p-5 rounded-2xl font-black uppercase text-xs shadow-xl active:scale-95 transition-all">Confirmar e Dar Baixa</button>
                                    <button onClick={()=>{setInvoiceModal(null); setInvoicePartialVal('');}} className="w-full text-slate-400 p-1 text-[9px] font-black uppercase hover:text-red-500">Voltar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-[#1A202C] text-white p-4 sticky top-0 z-50 border-b-4 border-[#D97757] shadow-xl">
                        <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-white p-1 rounded-full"><img src="logo.png" className="h-8 w-8 object-contain" alt="Logo" onError={(e)=>{e.target.onerror=null; e.target.src="https://placehold.co/100x100/FFF/000?text=TB"}}/></div>
                                <h1 className="text-lg font-black text-[#F8CC82] uppercase tracking-tighter">Tribo Burger v2.8.6</h1>
                                <span className={"text-[7px] font-black px-2 py-1 rounded-md " + (!user ? "bg-amber-500 text-black animate-pulse" : "bg-emerald-500 text-black")}>
                                    {!user ? 'ACESSO BLOQUEADO' : 'CONTA REGISTADA'}
                                </span>
                            </div>
                            {user && (
                                <nav className="flex bg-white/5 p-1 rounded-2xl overflow-x-auto no-scrollbar">
                                    {['dashboard', 'saldos', 'vendas', 'a_pagar', 'a_receber', 'cartoes', 'resultados', 'dre', 'fornecedores', 'ajustes'].map(t => (
                                        <button key={t} onClick={()=>setActiveTab(t)} className={"px-4 py-2 text-[10px] font-black uppercase whitespace-nowrap transition-all " + (activeTab === t ? "tab-active" : "text-slate-400 hover:text-white")}>{t.replace('_', ' ')}</button>
                                    ))}
                                </nav>
                            )}
                            <div className="flex items-center gap-3 flex-wrap justify-end">
                                {!user ? (
                                    <button onClick={() => setAuthMode('manual')} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-[8px] font-black uppercase px-3 py-1.5 rounded-xl transition-all">Entrar c/ E-mail</button>
                                ) : (
                                    <button onClick={async () => { await auth.signOut(); }} className="bg-red-500 hover:bg-red-600 text-white font-black text-[8px] uppercase px-3 py-1.5 rounded-xl transition-all">Terminar Sessão</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {!user && authMode === 'manual' && (
                        <div className="flex-1 flex justify-center items-center p-6 bg-slate-100">
                            <div className="max-w-md w-full p-8 bg-white text-slate-800 rounded-3xl shadow-xl flex flex-col gap-4 border-t-8 border-[#D97757]">
                                <div className="text-center mb-4">
                                    <div className="w-16 h-16 bg-[#1A202C] text-[#F8CC82] rounded-full mx-auto flex items-center justify-center mb-4 shadow-lg"><Lock size={24} /></div>
                                    <h3 className="font-black text-xl uppercase text-slate-800">Acesso Restrito</h3>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mt-1">Inicie sessão ou crie uma conta para aceder ao sistema financeiro.</p>
                                </div>
                                {authError && <div className="p-4 bg-red-100 border border-red-200 text-red-600 text-[10px] font-black uppercase rounded-xl text-center">{authError}</div>}
                                
                                <form onSubmit={handleManualLogin} className="space-y-4">
                                    <div className="space-y-1"><label className="text-[9px] font-black text-slate-500 uppercase ml-2">Email</label><input type="email" placeholder="gestao@triboburger.com" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold uppercase outline-none focus:border-[#D97757] transition-all" value={email} onChange={e=>setEmail(e.target.value)} /></div>
                                    <div className="space-y-1"><label className="text-[9px] font-black text-slate-500 uppercase ml-2">Palavra-Passe</label><input type="password" placeholder="••••••••" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold uppercase outline-none focus:border-[#D97757] transition-all" value={password} onChange={e=>setPassword(e.target.value)} /></div>
                                    <button className="w-full bg-black text-[#F8CC82] hover:bg-slate-800 p-5 rounded-2xl font-black text-[11px] uppercase shadow-lg active:scale-95 transition-all mt-2">{isRegistering ? 'Criar Nova Conta' : 'Entrar na Conta Mestre'}</button>
                                </form>

                                <div className="relative my-4"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div><div className="relative flex justify-center text-[9px] uppercase font-black text-slate-400"><span className="bg-white px-3">ou</span></div></div>

                                <div className="text-center">
                                    <button type="button" onClick={() => {setIsRegistering(!isRegistering); setAuthError('');}} className="text-[10px] font-black uppercase text-[#D97757] hover:text-black tracking-wider transition-colors border-b border-transparent hover:border-black pb-1">
                                        {isRegistering ? 'Já tenho conta? Fazer Login' : 'Ainda não tem conta? Registar-se'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {user && (
                        <main className="p-4 max-w-7xl mx-auto w-full flex-1 space-y-6">
                            
                            <div className="glass-card p-6 rounded-[2.5rem] border-l-8 border-[#D97757] shadow-md flex flex-col md:flex-row justify-between items-center gap-4 bg-white">
                                <div>
                                    <h3 className="text-xs font-black uppercase text-slate-800 flex items-center gap-2">
                                        <Bell size={16} className="text-[#D97757]" /> Painel de Diagnóstico do Sistema
                                    </h3>
                                    <div className="flex flex-wrap items-center gap-2 mt-1.5">
                                        <span className="text-[9px] font-bold text-slate-400 uppercase bg-slate-100 px-2.5 py-1 rounded">
                                            ID Autenticado: <span className="font-mono text-slate-800">{user?.uid}</span>
                                        </span>
                                        <span className={"text-[9px] font-black px-2.5 py-1 rounded uppercase " + (transactions.length > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700 animate-pulse')}>
                                            {transactions.length > 0 ? transactions.length + " Lançamentos Carregados" : '0 Lançamentos na Nuvem'}
                                        </span>
                                    </div>
                                    {transactions.length === 0 && (
                                        <p className="text-[9px] font-bold text-red-500 uppercase mt-2 leading-relaxed max-w-2xl">
                                            * O seu ID atual não possui dados guardados no Firebase Realtime Database. Para ver o seu histórico antigo, pode utilizar a ferramenta de importação/restauro na aba Ajustes.
                                        </p>
                                    )}
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    <button onClick={()=>setActiveTab('ajustes')} className="bg-black hover:bg-slate-800 text-[#F8CC82] text-[9px] font-black uppercase px-4 py-3 rounded-xl transition-all flex items-center gap-2 shadow-lg">
                                        <Download size={14} /> Importar / Ajustes
                                    </button>
                                </div>
                            </div>

                            <div className="flex justify-center">
                                <div className="glass-card px-6 py-2 rounded-full flex items-center gap-4 border shadow-sm">
                                    <span className="text-[9px] font-black uppercase text-slate-400">Mês Base:</span>
                                    <input type="month" value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} className="bg-transparent border-0 outline-none font-black text-[#D97757] text-sm cursor-pointer" />
                                </div>
                            </div>

                            {alerts.length > 0 && (
                                <div className="glass-card p-6 rounded-[2.5rem] border-t-8 border-amber-500 bg-amber-50/10 shadow-lg space-y-4 fade-in">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-amber-100 p-2 rounded-2xl text-amber-600 animate-pulse"><Bell size={18} /></div>
                                        <div>
                                            <h3 className="text-xs font-black uppercase text-amber-800 tracking-wider">Compromissos Próximos ou Vencidos ({alerts.length})</h3>
                                            <p className="text-[9px] font-semibold text-slate-400 uppercase">Alertas de até 2 dias antes do vencimento</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                        {alerts.map(item => {
                                            const isOverdue = item.diffDays < 0; const isToday = item.diffDays === 0;
                                            let cardBg = "bg-white border hover:border-amber-400 transition-all"; let badgeColor = "bg-amber-100 text-amber-700"; let label = "Vence em " + item.diffDays + " dias";
                                            if (isOverdue) { cardBg = "bg-red-50/30 border border-red-200 hover:border-red-400 transition-all"; badgeColor = "bg-red-100 text-red-700"; label = "Vencido há " + Math.abs(item.diffDays) + " dias"; }
                                            else if (isToday) { cardBg = "bg-orange-50/30 border border-orange-200 hover:border-orange-400 transition-all"; badgeColor = "bg-orange-100 text-orange-700"; label = "Vence hoje"; }
                                            else if (item.diffDays === 1) { label = "Vence amanhã"; }
                                            return (
                                                <div key={item.id} className={"p-4 rounded-2xl shadow-sm flex justify-between items-center " + cardBg}>
                                                    <div className="space-y-1 pr-2">
                                                        <p className="font-black text-xs uppercase leading-tight text-slate-800 truncate max-w-[180px]" title={item.description}>{item.description}</p>
                                                        <div className="flex flex-wrap items-center gap-1.5"><span className="text-[8px] font-bold text-slate-400 uppercase bg-slate-100 px-1.5 py-0.5 rounded">{item.account}</span><span className={"status-badge " + badgeColor}>{label}</span></div>
                                                    </div>
                                                    <div className="text-right flex-shrink-0">
                                                        <p className={"font-black text-xs " + (item.type === 'entrada' ? 'text-green-600' : 'text-red-600')}>{item.type === 'entrada' ? '+' : '-'} {formatMoney(item.amount)}</p>
                                                        <p className="text-[8px] text-slate-400 font-bold mt-0.5">{item.clearanceDate.split('-').reverse().slice(0, 2).join('/')}</p>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <form onSubmit={handleSaveTx} className="lg:col-span-1 glass-card p-8 rounded-[3rem] shadow-sm space-y-4 border-t-4 border-black h-fit relative">
                                            {editingId && <div className="absolute -top-4 right-8 bg-blue-600 text-white text-[8px] font-black px-3 py-1 rounded-full uppercase shadow-md">Editando Lançamento</div>}
                                            <div className="flex gap-1 bg-slate-100 p-1 rounded-2xl">
                                                {['entrada','saida','transferencia'].map(t=>(
                                                    <button key={t} type="button" onClick={()=>setType(t)} className={"flex-1 py-3 rounded-xl font-black text-[9px] uppercase transition-all " + (type===t ? 'bg-white shadow-sm text-black' : 'text-slate-400 hover:bg-slate-200')}>{t}</button>
                                                ))}
                                            </div>
                                            <div className="relative">
                                                <input list="history-descriptions" type="text" placeholder="Descrição da Transação" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:border-black transition-colors" value={desc} onChange={e=>setDesc(e.target.value)} />
                                                <datalist id="history-descriptions">{uniqueDescriptions.map((d, i) => <option key={i} value={d} />)}</datalist>
                                            </div>
                                            
                                            <div className="grid grid-cols-3 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[8px] font-black uppercase text-slate-400 ml-1">Valor Total</label>
                                                    <input type="text" placeholder="0,00" required className="w-full p-3.5 bg-slate-50 border rounded-2xl font-black text-sm outline-none focus:border-black transition-colors text-center" value={val} onChange={e=>setVal(e.target.value)} />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[8px] font-black uppercase text-slate-400 ml-1">Parcelas</label>
                                                    <input type="number" min="1" max="120" className="w-full p-3.5 bg-slate-50 border rounded-2xl font-black text-sm outline-none focus:border-black transition-colors text-center" value={inst} onChange={e=>setInst(e.target.value)} disabled={type === 'transferencia'} />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[8px] font-black uppercase text-slate-400 ml-1">Conta</label>
                                                    <select className="w-full p-3.5 bg-white border rounded-2xl font-black text-[10px] outline-none focus:border-black transition-colors" value={account} onChange={e=>setAccount(e.target.value)} required>
                                                        <option value="">{type === 'transferencia' ? 'Origem...' : 'Conta...'}</option>
                                                        {accounts.map(a=><option key={a.id} value={a.name}>{a.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            
                                            {p(val) > 0 && parseInt(inst) > 1 && type !== 'transferencia' && (
                                                <div className="p-3 bg-orange-50 rounded-2xl border border-orange-100 text-center animate-pulse">
                                                    <p className="text-[9px] font-black text-orange-600 uppercase">
                                                        Serão gerados {parseInt(inst)} lançamentos mensais de {formatMoney(p(val) / parseInt(inst))} cada
                                                    </p>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-3">
                                                {type === 'transferencia' ? (
                                                    <div className="space-y-1">
                                                        <label className="text-[8px] font-black uppercase text-[#D97757] ml-1">Conta Destino</label>
                                                        <select className="w-full p-3.5 bg-white border border-[#D97757] rounded-2xl font-black text-[10px] outline-none focus:border-black" value={destAcc} onChange={e=>setDestAcc(e.target.value)} required>
                                                            <option value="">Destino...</option>
                                                            {accounts.filter(a => a.name !== account).map(a=><option key={a.id} value={a.name}>{a.name}</option>)}
                                                        </select>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-1">
                                                        <label className="text-[8px] font-black uppercase text-slate-400 ml-1">Categoria</label>
                                                        <select className="w-full p-3.5 bg-white border rounded-2xl font-black text-[10px] outline-none focus:border-black transition-colors" value={cat} onChange={e=>setCat(e.target.value)} required>
                                                            <option value="">Categoria...</option>
                                                            {sortedCategories.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
                                                        </select>
                                                    </div>
                                                )}
                                                <div className="space-y-1">
                                                    <label className="text-[8px] font-black uppercase text-slate-400 ml-1">Fornecedor / Cliente</label>
                                                    <select className="w-full p-3.5 bg-white border rounded-2xl font-black text-[10px] outline-none focus:border-black transition-colors" value={sup} onChange={e=>setSup(e.target.value)} disabled={type === 'transferencia'}>
