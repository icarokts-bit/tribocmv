<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribo Burger - Sistema de Precificação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0D0C0B; color: #FAF8F5; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-80 bg-[#161513] border-r border-[#262421] flex flex-col shrink-0">
        <div class="p-6 border-b border-[#262421] flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-[#F27A18] flex items-center justify-center font-black text-black text-xl shadow-lg">TB</div>
            <div>
                <h1 class="font-black text-lg uppercase tracking-wide">Tribo Burger</h1>
                <p class="text-[10px] text-[#F27A18] font-bold">Gestão de Custos & CMV</p>
            </div>
        </div>

        <div id="auth-panel" class="p-4 border-b border-[#262421] text-xs text-brand-textMuted">
            <div id="logged-in-view" class="hidden">
                <p class="text-emerald-500 font-bold mb-1">Logado como:</p>
                <p id="user-email" class="text-white mb-2 break-all"></p>
                <button onclick="window.performLogout()" class="text-red-400 underline font-bold">Sair</button>
            </div>
            <div id="anonymous-view">
                <p>Carregando conta...</p>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-chart-pie w-5"></i> Painel Geral</button>
            <button onclick="switchTab('ingredients')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-egg w-5"></i> Insumos</button>
            <button onclick="switchTab('recipes')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-book-open w-5"></i> Fichas Técnicas</button>
            <button onclick="switchTab('combos')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-boxes-packing w-5"></i> Fichas de Combos</button>
            <button onclick="switchTab('analysis')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-calculator w-5"></i> Análise Geral</button>
            <button onclick="switchTab('fixed-costs')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-house-laptop w-5"></i> Custos Fixos</button>
            <button onclick="switchTab('settings')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold hover:bg-[#1E1C1A] text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-sliders w-5"></i> Parâmetros</button>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <div id="tab-dashboard" class="tab-content active">Painel Geral</div>
        <div id="tab-ingredients" class="tab-content">Insumos</div>
        <div id="tab-recipes" class="tab-content">Fichas Técnicas</div>
        <div id="tab-combos" class="tab-content">Fichas de Combos</div>
        <div id="tab-analysis" class="tab-content">Análise Geral</div>
        <div id="tab-fixed-costs" class="tab-content">Custos Fixos</div>
        <div id="tab-settings" class="tab-content">
            <h2 class="text-xl font-bold mb-4">Migrar Dados Antigos</h2>
            <input id="old-uid-input" placeholder="ID Antigo (9AbYn0s...)" class="bg-black p-2 border border-gray-700 w-full mb-2 text-sm">
            <button onclick="window.performMigration()" class="bg-[#F27A18] text-black font-bold p-2 w-full rounded">Migrar Dados</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const config = {
            apiKey: "AIzaSyA1HkiCs0F4BkHeDNVNHNuhG0Ktd2VQDLU",
            projectId: "tribocmv",
            appId: "1:740375597526:web:f826bba62245da21f0d477"
        };
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Funções Globais (Hoisting via window)
        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        };

        window.performLogout = () => {
            signOut(auth).then(() => location.reload());
        };

        window.performMigration = async () => {
            const oldUid = document.getElementById('old-uid-input').value;
            const user = auth.currentUser;
            if (!user) return alert("Faça login!");
            
            try {
                const oldPath = doc(db, 'artifacts', 'tribo-burger-pricing-system', 'users', oldUid, 'user_data', 'state');
                const newPath = doc(db, 'artifacts', 'tribo-burger-pricing-system', 'users', user.uid, 'user_data', 'state');
                const snap = await getDoc(oldPath);
                if (snap.exists()) {
                    await setDoc(newPath, snap.data());
                    alert("Dados migrados com sucesso!");
                    location.reload();
                } else {
                    alert("UID antigo não encontrado.");
                }
            } catch (e) {
                alert("Erro: " + e.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const authPanel = document.getElementById('anonymous-view');
            const loggedInView = document.getElementById('logged-in-view');
            if (user) {
                document.getElementById('user-email').textContent = user.email || 'Utilizador Logado';
                authPanel.classList.add('hidden');
                loggedInView.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
