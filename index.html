        window.toggleDirectAuthMode = function() {
            authMode = authMode === 'login' ? 'register' : 'login';
            const submitBtn = document.getElementById('btn-direct-submit');
            const toggleBtn = document.getElementById('btn-toggle-direct');
            const label = document.getElementById('direct-auth-toggle-label');
            const errorBox = document.getElementById('locked-error-box');
            
            if (errorBox) errorBox.classList.add('hidden');

            if (authMode === 'login') {
                if (submitBtn) submitBtn.textContent = 'Entrar no Sistema';
                if (toggleBtn) toggleBtn.textContent = 'Criar Conta';
                if (label) label.textContent = 'Ainda não tem conta?';
            } else {
                if (submitBtn) submitBtn.textContent = 'Criar e Registar Conta';
                if (toggleBtn) toggleBtn.textContent = 'Iniciar Sessão';
                if (label) label.textContent = 'Já possui uma conta?';
            }
        };

        window.handleDirectAuthSubmit = async function() {
            const email = document.getElementById('direct-email').value.trim();
            const password = document.getElementById('direct-password').value;
            const errorBox = document.getElementById('locked-error-box');

            if (!auth) {
                if (errorBox) {
                    errorBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Erro de sistema: Conexão com a base de dados falhou.';
                    errorBox.classList.remove('hidden');
                }
                return;
            }

            if (!email || !password) {
                if (errorBox) {
                    errorBox.textContent = 'Por favor, preencha o seu email e senha.';
                    errorBox.classList.remove('hidden');
                }
                return;
            }

            if (password.length < 6) {
                if (errorBox) {
                    errorBox.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
                    errorBox.classList.remove('hidden');
                }
                return;
            }

            try {
                // Desativa o botão temporariamente para evitar cliques duplos
                const btnSubmit = document.getElementById('btn-direct-submit');
                if (btnSubmit) {
                    btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';
                    btnSubmit.disabled = true;
                }

                if (authMode === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                if (errorBox) errorBox.classList.add('hidden');
            } catch (error) {
                console.error("Erro Auth Direto:", error);
                const btnSubmit = document.getElementById('btn-direct-submit');
                if (btnSubmit) {
                    btnSubmit.textContent = authMode === 'login' ? 'Entrar no Sistema' : 'Criar e Registar Conta';
                    btnSubmit.disabled = false;
                }

                if (errorBox) {
                    let userMsg = 'Erro de credenciais. Verifique os dados.';
                    if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        userMsg = 'Dados incorretos. Verifique o email e palavra-passe.';
                    } else if (error.code === 'auth/email-already-in-use') {
                        userMsg = 'Este email já se encontra registado.';
                    } else if (error.code === 'auth/network-request-failed') {
                        userMsg = 'Falha na rede. Verifique a sua ligação à internet.';
                    }
                    errorBox.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> ${userMsg}`;
                    errorBox.classList.remove('hidden');
                }
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            // Inicializar renderização UI vazia antes do Firebase autenticar
            window.renderAll();

            // Garantimos que a autenticação e estado do sistema será monitorizado em tempo real, se o Firebase estiver ativo
            if (auth) {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        updateAuthenticationUI(user);
                        
                        if (!user.isAnonymous) {
                            initCloudSyncListener();
                        }
                    } else {
                        updateAuthenticationUI(null);
                    }
                });
            } else {
                updateAuthenticationUI(null); // Mostra o ecrã de bloqueio indicando falha
            }
        });
