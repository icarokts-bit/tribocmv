<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribo Burger | Gestão Financeira v2.8.6</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Scripts do Firebase com verificação de carregamento -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;800&display=swap');
        body { font-family: 'Plus+Jakarta+Sans', sans-serif; }
        .terminal-box { background: #0f172a; color: #10b981; font-family: 'Courier New', Courier, monospace; padding: 1rem; border-radius: 0.5rem; font-size: 0.8rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Monitoramento de erro global para evitar interrupção da execução
        window.onerror = (msg, url, line) => {
            console.error(`[GLOBAL] Erro detectado: ${msg} em ${url}:${line}`);
            return true;
        };

        function App() {
            const [status, setStatus] = useState("Inicializando sistema...");

            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
                            // Configuração vinda do ambiente seguro
                            const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                            firebase.initializeApp(config);
                            setStatus("Sistema conectado com sucesso.");
                        } else {
                            setStatus("Firebase já inicializado.");
                        }
                    } catch (e) {
                        setStatus("Erro na inicialização: " + e.message);
                    }
                };

                initFirebase();
            }, []);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6">
                    <div className="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 w-full max-w-md">
                        <h1 className="text-2xl font-black mb-2">Tribo Burger</h1>
                        <p className="text-slate-500 mb-6 text-sm">{status}</p>
                        
                        <div className="space-y-4">
                            <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div className="h-full bg-orange-500 animate-pulse w-full"></div>
                            </div>
                        </div>
                    </div>
                    <footer className="mt-8 text-[10px] uppercase tracking-widest opacity-40">
                        Tribo Burger Financeiro • v2.8.6 GOLDEN STABLE
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
